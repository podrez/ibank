services:
  account-balances:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: account-balances
    restart: unless-stopped

    # Environment variables
    env_file:
      - stack.env

    # Overrides that must always be set inside the container
    environment:
      - DB_PATH=/app/data/accounts.db
      - API_PORT=3000
      - HEADLESS=true

    # Chromium requires shared memory
    shm_size: '512mb'

    # Volume for persistent database and debug files
    volumes:
      - account-balances-data:/app/data

    # Run migrations then start the app
    command: sh -c "npm run db:migrate && node dist/index.js"

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    ports:
      - "3000:3000"

    networks:
      - account-balances-network

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  account-balances-data:
    driver: local

networks:
  account-balances-network:
    driver: bridge

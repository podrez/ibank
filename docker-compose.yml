services:
  account-balances:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: account-balances
    restart: unless-stopped

    # Environment variables
    env_file:
      - stack.env

    # Overrides that must always be set inside the container
    environment:
      - DB_PATH=/app/data/accounts.db
      - HEADLESS=true

    # Chromium requires shared memory
    shm_size: '512mb'

    # Volume for persistent database and debug files
    volumes:
      - account-balances-data:/app/data

    # Run migrations then start the app
    command: sh -c "node dist/db/migrate.js && node dist/index.js"

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${API_PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"

    networks:
      - account-balances-network

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  account-balances-data:
    driver: local

networks:
  account-balances-network:
    driver: bridge

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iBank · Остатки</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --border: #e3e6ec;
      --text: #111827;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --red: #dc2626;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 16px rgba(0,0,0,.1);
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login ─────────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 380px;
    }

    .login-logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 0.25rem;
    }

    .login-logo span { color: var(--accent); }

    .login-card > p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .field { margin-bottom: 0; }

    .field label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }

    .field input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 0.9375rem;
      font-family: 'Courier New', monospace;
      outline: none;
      transition: border-color .15s;
      color: var(--text);
      background: var(--surface);
    }

    .field input:focus { border-color: var(--accent); }

    .error-msg {
      color: var(--red);
      font-size: 0.8125rem;
      margin-top: 0.5rem;
      min-height: 1.25rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.625rem 1.125rem;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 0.9375rem;
      font-weight: 500;
      transition: background .15s, opacity .15s, border-color .15s;
      white-space: nowrap;
    }

    .btn:disabled { opacity: .55; cursor: default; pointer-events: none; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
      margin-top: 1.25rem;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    /* ── Dashboard ─────────────────────────────────── */
    #dashboard { display: none; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.75rem;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .header-title span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .status-wrap {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    #status-bar {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    #status-bar.is-error { color: var(--red); }

    .countdown {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .btn-refresh {
      background: var(--accent);
      color: #fff;
      padding: 0.4rem 0.9rem;
      font-size: 0.875rem;
    }

    .btn-refresh:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--bg); }

    /* ── Grid ───────────────────────────────────────── */
    main {
      padding: 1.5rem 1.75rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    #accounts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1rem;
    }

    /* ── Account card ──────────────────────────────── */
    .account-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      padding: 1.25rem 1.375rem;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .bank-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .bank-alfabank  { background: #fee2e2; color: #991b1b; }
    .bank-priorbank { background: #dbeafe; color: #1e40af; }
    .bank-unknown   { background: #f3f4f6; color: #374151; }

    .currency-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--text-muted);
    }

    .account-name {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-number {
      font-family: 'Courier New', monospace;
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      letter-spacing: .03em;
    }

    .balance-block { flex: 1; }

    .balance-amount {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      margin-bottom: 0.2rem;
    }

    .balance-currency {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 0.25rem;
    }

    .available-line {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      margin-bottom: 0.5rem;
      min-height: 1.25rem;
    }

    .today-flow {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
    }

    .flow-credit {
      color: #16a34a;
      font-weight: 600;
    }

    .flow-debit {
      color: var(--red);
      font-weight: 600;
    }

    .flow-label {
      color: var(--text-muted);
      font-weight: 400;
    }

    .card-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      margin-top: auto;
    }

    /* ── Empty / skeleton ──────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      font-size: 0.9375rem;
    }

    @keyframes shimmer {
      from { background-position: -600px 0; }
      to   { background-position:  600px 0; }
    }

    .skel {
      background: linear-gradient(90deg, #ebebeb 25%, #d8d8d8 50%, #ebebeb 75%);
      background-size: 1200px 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }

    .skel-badge  { height: 20px; width: 90px; border-radius: 5px; }
    .skel-label  { height: 14px; width: 65%; margin-bottom: 0.3rem; }
    .skel-mono   { height: 12px; width: 80%; margin-bottom: 1rem; }
    .skel-amount { height: 40px; width: 55%; margin-bottom: 0.25rem; }
    .skel-avail  { height: 13px; width: 50%; margin-bottom: 1rem; }
    .skel-footer { height: 12px; width: 70%; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }

    /* ── Visibility / edit mode ────────────────────── */
    .btn-settings {
      background: transparent;
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
    }

    .btn-settings:hover { background: var(--bg); }

    .btn-settings.is-active {
      border-color: var(--accent);
      color: var(--accent);
      background: #eff6ff;
    }

    .edit-mode-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding: 0.5rem 1rem;
      background: #eff6ff;
      border-bottom: 1px solid #bfdbfe;
    }

    .account-card.is-hidden {
      opacity: 0.45;
    }

    .account-card .visibility-btn {
      display: none;
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.35rem 0.75rem;
      font-size: 0.8125rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }

    .account-card .visibility-btn:hover {
      background: var(--bg);
      color: var(--text);
    }

    .account-card.is-hidden .visibility-btn {
      border-color: var(--accent);
      color: var(--accent);
    }

    .account-card.is-hidden .visibility-btn:hover {
      background: #eff6ff;
    }

    body.edit-mode .account-card .visibility-btn { display: block; }

    .hidden-count-badge {
      font-size: 0.8125rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline dotted;
    }

    .hidden-count-badge:hover { color: var(--accent); }

    /* ── Statement button on card ──────────────────── */
    .btn-statement {
      display: none;
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.35rem 0.75rem;
      font-size: 0.8125rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: #eff6ff;
      color: var(--accent);
      cursor: pointer;
      transition: background .15s, color .15s;
      font-weight: 500;
    }

    .btn-statement:hover { background: var(--accent); color: #fff; }

    .account-card.has-statement .btn-statement { display: block; }

    body.edit-mode .account-card.has-statement .btn-statement { display: none; }

    /* ── Statement modal ───────────────────────────── */
    #stmt-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-y: auto;
    }

    #stmt-overlay.is-open { display: flex; }

    #stmt-modal {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
    }

    .stmt-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .stmt-modal-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .stmt-modal-title small {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 0.5rem;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
      padding: 0.25rem;
    }

    .btn-close:hover { color: var(--text); }

    .stmt-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .stmt-controls label {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stmt-controls input[type=date] {
      padding: 0.375rem 0.625rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color .15s;
    }

    .stmt-controls input[type=date]:focus { border-color: var(--accent); }

    .stmt-tabs {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .stmt-tab {
      padding: 0.35rem 0.75rem;
      font-size: 0.8125rem;
      font-weight: 500;
      border: none;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }

    .stmt-tab + .stmt-tab { border-left: 1px solid var(--border); }

    .stmt-tab:hover { background: var(--bg); color: var(--text); }

    .stmt-tab.is-active { background: var(--accent); color: #fff; }

    .btn-sm {
      padding: 0.375rem 0.875rem;
      font-size: 0.875rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background .15s, opacity .15s;
    }

    .btn-sm:disabled { opacity: .55; cursor: default; }

    .btn-sm-primary { background: var(--accent); color: #fff; }
    .btn-sm-primary:not(:disabled):hover { background: var(--accent-hover); }

    .btn-sm-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-sm-secondary:not(:disabled):hover { background: var(--bg); }

    .stmt-body {
      padding: 1rem 1.5rem 1.5rem;
      overflow-x: hidden;
    }

    #stmt-status {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      min-height: 1.25rem;
    }

    #stmt-status.is-error { color: var(--red); }

    .stmt-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .stmt-table col.col-date   { width: 82px; }
    .stmt-table col.col-cp     { width: 22%; }
    .stmt-table col.col-desc   { width: 30%; }
    .stmt-table col.col-ref    { width: 14%; }
    .stmt-table col.col-amount { width: 90px; }
    .stmt-table col.col-cur    { width: 44px; }

    .stmt-table th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    .stmt-table td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .stmt-table tr:last-child td { border-bottom: none; }

    .stmt-table tr:hover td { background: var(--bg); }

    .stmt-debit  { color: var(--red); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .stmt-credit { color: #16a34a;   font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .stmt-date   { white-space: nowrap; font-family: 'Courier New', monospace; font-size: 0.8rem; }
    .stmt-ref    { font-family: 'Courier New', monospace; font-size: 0.75rem; color: var(--text-muted); word-break: break-all; }
    .stmt-desc   { word-break: break-word; overflow-wrap: anywhere; }
    .stmt-unp    { font-size: 0.72rem; color: var(--text-muted); }

    .stmt-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<!-- ──────────────── Login ──────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">i<span>Bank</span></div>
    <p>Остатки на расчётных счетах</p>
    <div class="field">
      <label for="api-key-input">API-ключ</label>
      <input id="api-key-input" type="password" placeholder="Введите ключ доступа"
             autocomplete="current-password" />
    </div>
    <div id="login-error" class="error-msg"></div>
    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Войти</button>
  </div>
</div>

<!-- ──────────────── Statement modal ──────── -->
<div id="stmt-overlay" onclick="overlayClick(event)">
  <div id="stmt-modal" role="dialog" aria-modal="true">
    <div class="stmt-modal-header">
      <div class="stmt-modal-title">
        Выписка <small id="stmt-title-account"></small>
      </div>
      <button class="btn-close" onclick="closeStatement()" title="Закрыть">&times;</button>
    </div>
    <div class="stmt-controls">
      <label for="stmt-from">С</label>
      <input type="date" id="stmt-from" />
      <label for="stmt-to">по</label>
      <input type="date" id="stmt-to" />
      <div class="stmt-tabs">
        <button class="stmt-tab is-active" data-dir="all"    onclick="setStmtDir(this)">Все</button>
        <button class="stmt-tab"           data-dir="debit"  onclick="setStmtDir(this)">Расход</button>
        <button class="stmt-tab"           data-dir="credit" onclick="setStmtDir(this)">Приход</button>
      </div>
      <button class="btn btn-sm btn-sm-primary" onclick="loadStatements()">Показать</button>
      <button class="btn btn-sm btn-sm-secondary" id="stmt-refresh-btn" onclick="refreshStatement()">&#8635; Обновить из банка</button>
    </div>
    <div class="stmt-body">
      <div id="stmt-status"></div>
      <div id="stmt-content"></div>
    </div>
  </div>
</div>

<!-- ──────────────── Dashboard ──────────── -->
<div id="dashboard">
  <header>
    <div class="header-title">i<span>Bank</span> · Остатки на счетах</div>
    <div class="header-right">
      <div class="status-wrap">
        <span id="status-bar"></span>
        <span id="countdown-wrap" class="countdown" style="display:none">
          · обновление через <b id="countdown-val">30</b>с
        </span>
      </div>
      <button class="btn btn-settings" id="settings-btn" onclick="toggleEditMode()">&#9881; Настроить</button>
      <button class="btn btn-refresh" id="refresh-btn" onclick="doRefresh()">&#8635; Синхронизировать</button>
      <button class="btn btn-secondary" onclick="doLogout()">Выйти</button>
    </div>
  </header>
  <div id="edit-mode-hint" class="edit-mode-hint" style="display:none">
    Режим настройки: нажмите на кнопку под счётом, чтобы скрыть или показать его.
    <span id="hidden-count-hint"></span>
  </div>
  <main>
    <div id="accounts-grid"></div>
  </main>
</div>

<script>
  const POLL_SEC = 30;

  let apiKey = sessionStorage.getItem('apiKey') || '';
  let countdownTimer = null;
  let secondsLeft = POLL_SEC;

  let isEditMode = false;
  let hiddenAccounts = new Set(JSON.parse(localStorage.getItem('hiddenAccounts') || '[]'));
  let lastAccounts = [];
  let statementAccountKeys = new Set();
  let todayTotals = {}; // key: "bank:accountNumber" → { totalCredit, totalDebit, currency }

  // active statement context
  let stmtBank = '';
  let stmtAccount = '';
  let lastTxs = [];

  // ── Boot ──────────────────────────────────────────
  if (apiKey) {
    showDashboard();
    renderSkeletons(3);
    loadStatementAccounts().then(() => Promise.all([loadTodayTotals(), loadAccounts()]));
    startCountdown();
  }

  document.getElementById('api-key-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // ── Auth ──────────────────────────────────────────
  async function doLogin() {
    const key = document.getElementById('api-key-input').value.trim();
    if (!key) return;

    setLoginBtn(true, 'Проверка...');
    setLoginError('');

    try {
      const res = await apiFetch('/api/accounts', 'GET', key);
      if (res.status === 401) {
        setLoginError('Неверный API-ключ');
        setLoginBtn(false, 'Войти');
        return;
      }
      sessionStorage.setItem('apiKey', key);
      apiKey = key;
      showDashboard();
      await loadStatementAccounts();
      await loadTodayTotals();
      const data = await res.json();
      renderAccounts(data.accounts);
      setStatus(`Счетов: ${data.accounts.length}`);
      startCountdown();
    } catch {
      setLoginError('Не удалось подключиться к серверу');
      setLoginBtn(false, 'Войти');
    }
  }

  function doLogout() {
    sessionStorage.removeItem('apiKey');
    apiKey = '';
    stopCountdown();
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('api-key-input').value = '';
    setLoginError('');
    setLoginBtn(false, 'Войти');
  }

  // ── Data ──────────────────────────────────────────
  async function loadAccounts() {
    try {
      const res = await apiFetch('/api/accounts', 'GET');
      if (res.status === 401) { doLogout(); return; }
      const data = await res.json();
      await loadTodayTotals();
      renderAccounts(data.accounts);
      setStatus(`Обновлено в ${formatTime(new Date())}`);
    } catch {
      setStatus('Ошибка загрузки', true);
    }
  }

  async function loadTodayTotals() {
    try {
      const res = await apiFetch('/api/today-totals', 'GET');
      if (!res.ok) return;
      const data = await res.json();
      todayTotals = {};
      for (const row of (data.totals || [])) {
        todayTotals[`${row.bank}:${row.accountNumber}`] = row;
      }
    } catch { /* ignore */ }
  }

  async function doRefresh() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Синхронизация...';
    stopCountdown();
    setStatus('Синхронизация запущена...');

    try {
      await apiFetch('/api/refresh', 'POST');
      await sleep(6000);
      await loadAccounts();
    } catch {
      setStatus('Ошибка запроса синхронизации', true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '&#8635; Синхронизировать';
      startCountdown();
    }
  }

  // ── Countdown ─────────────────────────────────────
  function startCountdown() {
    stopCountdown();
    secondsLeft = POLL_SEC;
    document.getElementById('countdown-wrap').style.display = 'inline';
    updateCountdownDisplay();
    countdownTimer = setInterval(async () => {
      secondsLeft--;
      updateCountdownDisplay();
      if (secondsLeft <= 0) {
        secondsLeft = POLL_SEC;
        await loadAccounts();
      }
    }, 1000);
  }

  function stopCountdown() {
    clearInterval(countdownTimer);
    countdownTimer = null;
    document.getElementById('countdown-wrap').style.display = 'none';
  }

  function updateCountdownDisplay() {
    document.getElementById('countdown-val').textContent = secondsLeft;
  }

  // ── Edit mode / visibility ────────────────────────
  function toggleEditMode() {
    isEditMode = !isEditMode;
    document.body.classList.toggle('edit-mode', isEditMode);
    document.getElementById('settings-btn').classList.toggle('is-active', isEditMode);
    document.getElementById('edit-mode-hint').style.display = isEditMode ? 'block' : 'none';
    renderAccounts(lastAccounts);
  }

  function toggleAccountVisibility(key) {
    if (hiddenAccounts.has(key)) {
      hiddenAccounts.delete(key);
    } else {
      hiddenAccounts.add(key);
    }
    localStorage.setItem('hiddenAccounts', JSON.stringify([...hiddenAccounts]));
    renderAccounts(lastAccounts);
  }

  // ── Render ────────────────────────────────────────
  function renderSkeletons(n) {
    const grid = document.getElementById('accounts-grid');
    grid.innerHTML = Array.from({ length: n }, () => `
      <div class="account-card">
        <div class="card-header">
          <div class="skel skel-badge"></div>
        </div>
        <div class="skel skel-label"></div>
        <div class="skel skel-mono"></div>
        <div class="skel skel-amount"></div>
        <div class="skel skel-avail"></div>
        <div class="skel skel-footer"></div>
      </div>
    `).join('');
  }

  function renderAccounts(accounts) {
    lastAccounts = accounts || [];
    const grid = document.getElementById('accounts-grid');

    if (!accounts || accounts.length === 0) {
      grid.innerHTML = '<div class="empty-state">Счета не найдены.<br>Дождитесь первой синхронизации или нажмите «Синхронизировать».</div>';
      return;
    }

    const visibleAccounts = isEditMode
      ? accounts
      : accounts.filter(a => !hiddenAccounts.has(`${a.bank}:${a.accountNumber}`));

    const hiddenCount = accounts.filter(a => hiddenAccounts.has(`${a.bank}:${a.accountNumber}`)).length;

    // Update hidden count hint in edit mode banner
    const hint = document.getElementById('hidden-count-hint');
    if (hint) {
      hint.textContent = hiddenCount > 0 ? ` Скрыто счетов: ${hiddenCount}.` : '';
    }

    if (visibleAccounts.length === 0) {
      grid.innerHTML = `<div class="empty-state">Все счета скрыты.
        <br><span class="hidden-count-badge" onclick="toggleEditMode()">Настроить видимость</span>
      </div>`;
      return;
    }

    grid.innerHTML = visibleAccounts.map(a => {
      const key = `${a.bank}:${a.accountNumber}`;
      const isHidden = hiddenAccounts.has(key);
      const hasStmt = statementAccountKeys.has(key);
      return `
      <div class="account-card${isHidden ? ' is-hidden' : ''}${hasStmt ? ' has-statement' : ''}">
        <div class="card-header">
          <span class="bank-badge bank-${esc(a.bank)}">${bankLabel(a.bank)}</span>
          <span class="currency-tag">${esc(a.currency)}</span>
        </div>
        ${a.name ? `<div class="account-name" title="${esc(a.name)}">${esc(a.name)}</div>` : ''}
        <div class="account-number">${fmtAccountNumber(a.accountNumber)}</div>
        <div class="balance-block">
          <div>
            <span class="balance-amount">${fmtBalance(a.balance)}</span>
            <span class="balance-currency">${esc(a.currency)}</span>
          </div>
          <div class="available-line">
            ${a.available != null && a.available !== a.balance
              ? `Доступно: ${fmtBalance(a.available)}&nbsp;${esc(a.currency)}`
              : ''}
          </div>
          ${renderTodayFlow(key, a.currency)}
        </div>
        <div class="card-footer">
          Обновлено: ${a.balanceUpdatedAt ? fmtDateTime(a.balanceUpdatedAt) : '—'}
        </div>
        <button class="btn-statement" onclick="openStatement('${esc(a.bank)}', '${esc(a.accountNumber)}')">
          &#128196; Выписка
        </button>
        <button class="visibility-btn" onclick="toggleAccountVisibility('${esc(key)}')">
          ${isHidden ? '&#128065; Показать счёт' : '&#128683; Скрыть счёт'}
        </button>
      </div>
    `;
    }).join('');
  }

  // ── Statement accounts ────────────────────────────
  async function loadStatementAccounts() {
    try {
      const res = await apiFetch('/api/statement-accounts', 'GET');
      if (!res.ok) return;
      const data = await res.json();
      statementAccountKeys = new Set((data.accounts || []).map(a => `${a.bank}:${a.accountNumber}`));
    } catch { /* ignore */ }
  }

  // ── Statement modal ───────────────────────────────
  function openStatement(bank, accountNumber) {
    stmtBank = bank;
    stmtAccount = accountNumber;
    document.getElementById('stmt-title-account').textContent =
      `${bankLabel(bank)} · ${fmtAccountNumber(accountNumber)}`;
    document.getElementById('stmt-from').value = todayStr();
    document.getElementById('stmt-to').value = todayStr();
    document.querySelectorAll('.stmt-tab').forEach((t, i) => t.classList.toggle('is-active', i === 0));
    document.getElementById('stmt-status').textContent = '';
    document.getElementById('stmt-status').className = '';
    document.getElementById('stmt-content').innerHTML = '';
    document.getElementById('stmt-overlay').classList.add('is-open');
    loadStatements();
  }

  function closeStatement() {
    document.getElementById('stmt-overlay').classList.remove('is-open');
  }

  function overlayClick(e) {
    if (e.target === document.getElementById('stmt-overlay')) closeStatement();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeStatement();
  });

  async function loadStatements() {
    const from = document.getElementById('stmt-from').value;
    const to = document.getElementById('stmt-to').value;
    setStmtStatus('Загрузка...');
    document.getElementById('stmt-content').innerHTML = '';

    try {
      const params = new URLSearchParams({ bank: stmtBank, account: stmtAccount, limit: '1000' });
      if (from) params.set('from', from);
      if (to)   params.set('to', to);
      const res = await apiFetch(`/api/statements?${params}`, 'GET');
      if (!res.ok) { setStmtStatus('Ошибка загрузки выписки', true); return; }
      const data = await res.json();
      lastTxs = data.transactions || [];
      renderStmtTable(lastTxs);
      setStmtStatus(lastTxs.length > 0
        ? `Загружено транзакций: ${lastTxs.length}`
        : '');
    } catch {
      setStmtStatus('Ошибка подключения', true);
    }
  }

  async function refreshStatement() {
    const btn = document.getElementById('stmt-refresh-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Обновляю...';
    const from = document.getElementById('stmt-from').value || firstDayOfMonthStr();
    const to   = document.getElementById('stmt-to').value   || todayStr();
    setStmtStatus('Запрос на обновление выписки отправлен...');

    try {
      await fetch('/api/statements/refresh', {
        method: 'POST',
        headers: { 'X-Api-Key': apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ bank: stmtBank, account: stmtAccount, dateFrom: from, dateTo: to }),
      });
      setStmtStatus('Обновление запущено. Подождите 10–30 секунд и нажмите «Показать».');
    } catch {
      setStmtStatus('Ошибка запроса обновления', true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '&#8635; Обновить из банка';
    }
  }

  function setStmtDir(btn) {
    document.querySelectorAll('.stmt-tab').forEach(t => t.classList.remove('is-active'));
    btn.classList.add('is-active');
    renderStmtTable(lastTxs);
  }

  function renderStmtTable(txs) {
    const el = document.getElementById('stmt-content');

    const direction = document.querySelector('.stmt-tab.is-active')?.dataset.dir ?? 'all';
    const filtered = direction === 'debit'  ? txs.filter(t => t.debit  != null)
                   : direction === 'credit' ? txs.filter(t => t.credit != null)
                   : txs;

    if (!filtered.length) {
      el.innerHTML = txs.length
        ? '<div class="stmt-empty">Нет операций, соответствующих фильтру.</div>'
        : '<div class="stmt-empty">Транзакций за выбранный период не найдено.</div>';
      setStmtStatus(txs.length ? `Загружено транзакций: ${txs.length} · показано: 0` : '');
      return;
    }

    if (direction !== 'all') {
      setStmtStatus(`Загружено транзакций: ${txs.length} · показано: ${filtered.length}`);
    }

    const rows = filtered.map(t => {
      const cpName = t.counterpartyName ? esc(t.counterpartyName) : '';
      const cpUnp  = t.counterpartyUnp  ? `<br><span class="stmt-unp">УНП&nbsp;${esc(t.counterpartyUnp)}</span>` : '';
      const cpCell = cpName ? cpName + cpUnp : (t.counterpartyUnp ? `<span class="stmt-unp">УНП&nbsp;${esc(t.counterpartyUnp)}</span>` : '—');
      return `
      <tr>
        <td class="stmt-date">${fmtDate(t.transactionDate)}</td>
        <td class="stmt-desc">${cpCell}</td>
        <td class="stmt-desc">${esc(t.description || '—')}</td>
        <td class="stmt-ref">${esc(t.reference || '—')}</td>
        <td class="stmt-debit">${t.debit != null ? fmtBalance(t.debit) : ''}</td>
        <td class="stmt-credit">${t.credit != null ? fmtBalance(t.credit) : ''}</td>
      </tr>
    `}).join('');

    el.innerHTML = `
      <table class="stmt-table">
        <colgroup>
          <col class="col-date">
          <col class="col-cp">
          <col class="col-desc">
          <col class="col-ref">
          <col class="col-amount">
          <col class="col-amount">
        </colgroup>
        <thead>
          <tr>
            <th>Дата</th>
            <th>Контрагент</th>
            <th>Описание</th>
            <th>Документ</th>
            <th style="text-align:right">Дебет</th>
            <th style="text-align:right">Кредит</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function setStmtStatus(msg, isError = false) {
    const el = document.getElementById('stmt-status');
    el.textContent = msg;
    el.className = isError ? 'is-error' : '';
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function firstDayOfMonthStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
  }

  function renderTodayFlow(key, currency) {
    const t = todayTotals[key];
    if (!t) return '';
    const cur = esc(t.currency || currency);
    const hasCredit = t.totalCredit > 0;
    const hasDebit  = t.totalDebit  > 0;
    if (!hasCredit && !hasDebit) return '';
    return `<div class="today-flow">
      ${hasCredit ? `<span class="flow-credit">+&thinsp;${fmtBalance(t.totalCredit)}&nbsp;${cur}</span>` : ''}
      ${hasDebit  ? `<span class="flow-debit">−&thinsp;${fmtBalance(t.totalDebit)}&nbsp;${cur}</span>`  : ''}
      <span class="flow-label">сегодня</span>
    </div>`;
  }

  // ── Helpers ───────────────────────────────────────
  function apiFetch(path, method = 'GET', key) {
    return fetch(path, {
      method,
      headers: { 'X-Api-Key': key ?? apiKey },
    });
  }

  function bankLabel(bank) {
    return { alfabank: 'Альфа-Банк', priorbank: 'Приорбанк' }[bank] ?? bank;
  }

  function fmtBalance(val) {
    if (val == null) return '—';
    return new Intl.NumberFormat('ru-BY', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    }).format(val);
  }

  function fmtAccountNumber(num) {
    if (!num) return '—';
    return num.replace(/(.{4})/g, '$1 ').trim();
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.slice(0, 10).split('-');
    return `${d}.${m}.${y}`;
  }

  function fmtDateTime(iso) {
    if (!iso) return '—';
    const s = iso.includes('Z') || iso.includes('+') ? iso : iso + 'Z';
    return new Date(s).toLocaleString('ru-BY', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
      timeZone: 'Europe/Minsk',
    });
  }

  function formatTime(d) {
    return d.toLocaleTimeString('ru-BY', {
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      timeZone: 'Europe/Minsk',
    });
  }

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('status-bar');
    el.textContent = msg;
    el.className = isError ? 'is-error' : '';
  }

  function setLoginBtn(disabled, label) {
    const btn = document.getElementById('login-btn');
    btn.disabled = disabled;
    btn.textContent = label;
  }

  function setLoginError(msg) {
    document.getElementById('login-error').textContent = msg;
  }

  function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }
</script>
</body>
</html>
